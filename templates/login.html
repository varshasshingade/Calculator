<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #3838a2;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #fff;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 24px;
            color: #555;
        }
        .problem {
            font-size: 18px;
            margin: 15px 0;
        }
        .result {
            margin: 15px 0;
            font-size: 25px;
            color: #c5120c; /* Red for incorrect answers */
        }
        .result.correct {
            color: #029102; /* Green for correct answers */
            font-weight: bold;
            font-size: 25px;


        }
        .check-mark {
        color: green;
        font-size: 50px;
        font-weight: bold;
        margin-right: 8px;
        }
        .cross-mark {
            color: red;
            font-size: 50px;
            font-weight: bold;
            margin-right: 8px;
        }
        input[type="text"] {
            padding: 10px;
            width: 100%;
            margin: 10px 0;
            direction: ltr; 
            border: 1px solid #a52727;
            border-radius: 5px;
        }
        button {
            background-color: #007bff;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        a {
            display: inline-block;
            margin-top: 10px;
            color: #007bff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">

   
    <h1>Login</h1>
    <form method="post" action="{{ url_for('login') }}">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br>
        <button type="submit">Login</button>
    </form>
    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}
</div>
</body>
</html>
