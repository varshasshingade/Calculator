<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solve the Problem</title>
    <style>
        .top-left-corner {
            position: absolute; /* Positions relative to the nearest positioned ancestor or viewport */
            top: 0;
            left: 0;
            margin: 10px; /* Optional: Add some spacing from the edges */
        }
        .top-right-corner{
            position: absolute; /* Positions relative to the nearest positioned ancestor or viewport */
            top: 0;
            right: 0;
            margin: 10px;

        }
        .operation{
            background: #fff;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;

            position: absolute; /* Positions relative to the nearest positioned ancestor or viewport */
            top: 60px;
            left: 0;
            margin: 10px;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #6d6dae;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #fff;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 24px;
            color: #555;
        }
        .problem {
            font-size: 18px;
            margin: 15px 0;
        }
        .result {
            margin: 15px 0;
            font-size: 25px;
            color: #c5120c; /* Red for incorrect answers */
        }
        .result.correct {
            color: #029102; /* Green for correct answers */
            font-weight: bold;
            font-size: 25px;


        }
        .check-mark {
        color: green;
        font-size: 70px;
        font-weight: bold;
        margin-right: 8px;
        }
        .cross-mark {
            color: red;
            font-size: 70px;
            font-weight: bold;
            margin-right: 8px;
        }
        input[type="text"] {
            padding: 10px;
            width: 100%;
            margin: 10px 0;
            direction: ltr; 
            border: 1px solid #a52727;
            border-radius: 5px;
        }
        button {
            background-color: #007bff;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        a {
            display: inline-block;
            margin-top: 10px;
            color: hsl(13, 90%, 40%);
            text-decoration: none;
            font-size: 30px;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Solve the Problem</h1>
        <div class="problem">
            <p><strong>Operation:</strong> {{ operation.capitalize() }}</p>
            <p><strong>Number 1:</strong> {{ number1 }}</p>
            <p><strong>Number 2:</strong> {{ number2 }}</p>
        </div>

        <form method="post" action="{{ url_for('solve_problem') }}">
            <label for="answer">Your Answer:</label>
            <input type="text" id="answer" name="answer" placeholder="Enter your answer" required>
            <button type="submit">Submit</button>
        </form>

        {% if result %}
        <div class="result">
            <p>
                {% if result == 'Correct' %}
                    <span class="check-mark">&#10003;</span>
                {% else %}
                    <span class="cross-mark">&#10007;</span>
                {% endif %}
            </p>
        </div>
        {% endif %}

        
    </div>

    <div class="operation">
    <h1>Select an Operation</h1>
    <form method="post" action="{{ url_for('select_operation') }}">
        <label for="operation">Choose an operation:</label>
        <select id="operation" name="operation" required>
            <option value="add">Addition</option>
            <option value="subtract">Subtraction</option>
            <option value="multiply">Multiplication</option>
            <option value="divide">Division</option>
        </select>
        <button type="submit">Next</button>
    </form>

    </div>
    <div class="top-right-corner">

        
        <a href="{{ url_for('logout') }}">Logout</a>
    </div>  
    <div class="top-left-corner">
    <a href="{{ url_for('select_operation') }}">select operation</a>
    </div>
</body>
</html>
